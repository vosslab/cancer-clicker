<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="mutation-burst-title mutation-burst-desc">
  <title id="mutation-burst-title">Mutation signal burst</title>
  <desc id="mutation-burst-desc">A glowing organic cell with radiating receptors and molecular signal rings.</desc>
  <defs>
    <radialGradient id="mutation-burst-cell" cx="42%" cy="34%" r="68%">
      <stop offset="0" stop-color="#fff4c7" />
      <stop offset="0.35" stop-color="#ff76bd" />
      <stop offset="0.78" stop-color="#ad287f" />
      <stop offset="1" stop-color="#47154f" />
    </radialGradient>
    <radialGradient id="mutation-burst-nucleus" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ecffff" />
      <stop offset="0.42" stop-color="#61f8e9" />
      <stop offset="1" stop-color="#16467a" />
    </radialGradient>
    <filter id="mutation-burst-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <g id="mutation-burst-receptor">
      <path d="M120 37 113 22 120 8 127 22Z" fill="#c8f75a" stroke="#f4ffd0" stroke-width="2" />
      <circle cx="120" cy="8" r="4" fill="#4cf3e2" />
