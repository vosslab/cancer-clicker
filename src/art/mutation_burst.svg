    <circle cx="120" cy="120" r="98" stroke="#4cf3e2" stroke-width="3" stroke-dasharray="3 13" opacity="0.74" />
    <circle cx="120" cy="120" r="82" stroke="#c8f75a" stroke-width="2" stroke-dasharray="20 9" opacity="0.62" />
  </g>
  <g id="mutation-burst-receptors">
    <use href="#mutation-burst-receptor" />
    <use href="#mutation-burst-receptor" transform="rotate(45 120 120)" />
    <use href="#mutation-burst-receptor" transform="rotate(90 120 120)" />
    <use href="#mutation-burst-receptor" transform="rotate(135 120 120)" />
    <use href="#mutation-burst-receptor" transform="rotate(180 120 120)" />
    <use href="#mutation-burst-receptor" transform="rotate(225 120 120)" />
    <use href="#mutation-burst-receptor" transform="rotate(270 120 120)" />
    <use href="#mutation-burst-receptor" transform="rotate(315 120 120)" />
  </g>
  <path d="M120 43C139 38 150 53 163 62c15 10 37 7 42 25 5 17-12 29-13 45-1 18 15 32 5 48-10 17-31 10-47 17-14 7-21 27-40 24-18-3-21-24-34-34-13-11-35-8-40-26-5-17 12-29 13-45 1-18-15-32-5-48 10-17 31-10 47-17 14-7 21-27 40-24Z" fill="url(#mutation-burst-cell)" stroke="#ffd5e8" stroke-width="4" />
  <circle cx="120" cy="120" r="42" fill="url(#mutation-burst-nucleus)" stroke="#e9fffb" stroke-width="4" />
  <path d="M91 115c16-20 31-25 52-11M95 143c17 10 34 8 49-5" fill="none" stroke="#fff7c6" stroke-width="7" stroke-linecap="round" opacity="0.68" />
  <circle cx="108" cy="106" r="7" fill="#fff" opacity="0.9" />
  <g fill="#c8f75a" stroke="#fffad4" stroke-width="2">
