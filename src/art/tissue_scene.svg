    <radialGradient id="tissue-wet" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#b74b68" stop-opacity="0.7"/><stop offset="0.55" stop-color="#6f294d" stop-opacity="0.3"/><stop offset="1" stop-color="#2a1027" stop-opacity="0"/></radialGradient>
    <radialGradient id="tissue-cell" cx="34%" cy="27%" r="76%"><stop offset="0" stop-color="#ffb1a7"/><stop offset="0.48" stop-color="#d85f75"/><stop offset="1" stop-color="#7b244b"/></radialGradient>
    <linearGradient id="tissue-vessel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8f8b"/><stop offset="0.42" stop-color="#c93757"/><stop offset="1" stop-color="#631d3d"/></linearGradient>
    <linearGradient id="tissue-collagen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4a09a"/><stop offset="0.5" stop-color="#ffd0b5"/><stop offset="1" stop-color="#bc6179"/></linearGradient>
    <radialGradient id="tissue-vesicle" cx="32%" cy="25%" r="72%"><stop offset="0" stop-color="#fff7c2"/><stop offset="0.36" stop-color="#e7c45f"/><stop offset="1" stop-color="#a45b46"/></radialGradient>
