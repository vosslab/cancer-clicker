<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="tissue-title tissue-desc">
  <title id="tissue-title">Cartoon living tissue chamber</title>
  <desc id="tissue-desc">A stylized body-horror tissue pocket made from swollen cells, ropey collagen, wet membrane folds, capillaries, red blood cells, and nutrient vesicles.</desc>
  <defs>
