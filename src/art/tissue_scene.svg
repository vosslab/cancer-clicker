<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="tissue-title tissue-desc">
  <title id="tissue-title">Stylized bioluminescent tissue cavern</title>
  <desc id="tissue-desc">A simplified, inferred inside-the-body game environment. Soft tissue folds, capillaries, extracellular mesh, nutrients, and floating cells frame a calm central pocket for a tumor cell.</desc>
  <defs>
    <linearGradient id="tissue-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d22"/>
      <stop offset="0.46" stop-color="#191047"/>
      <stop offset="1" stop-color="#250735"/>
    </linearGradient>
    <radialGradient id="tissue-pocket" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1d3563" stop-opacity="0.78"/>
      <stop offset="0.45" stop-color="#182659" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#130d39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tissue-fold" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ff6b83"/>
      <stop offset="0.38" stop-color="#ad2d71"/>
      <stop offset="1" stop-color="#4c145b"/>
    </linearGradient>
    <linearGradient id="tissue-fold-deep" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#3c145b"/>
      <stop offset="0.5" stop-color="#7d235e"/>
      <stop offset="1" stop-color="#ec4f72"/>
    </linearGradient>
    <linearGradient id="tissue-vessel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a123d"/>
      <stop offset="0.4" stop-color="#f14c70"/>
      <stop offset="0.7" stop-color="#8c1b56"/>
      <stop offset="1" stop-color="#390d42"/>
    </linearGradient>
    <radialGradient id="tissue-droplet" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="#edffff"/>
      <stop offset="0.26" stop-color="#7ffbf7"/>
      <stop offset="0.72" stop-color="#1bb9dc"/>
      <stop offset="1" stop-color="#2868c5"/>
    </radialGradient>
    <radialGradient id="tissue-cell" cx="35%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ffc2d5"/>
      <stop offset="0.5" stop-color="#f2629b"/>
      <stop offset="1" stop-color="#8d265e"/>
    </radialGradient>
    <filter id="tissue-soft-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="tissue-blur"/>
      <feMerge><feMergeNode in="tissue-blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tissue-nutrient-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="tissue-glow"/>
      <feMerge><feMergeNode in="tissue-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="tissue-nutrient" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12" fill="url(#tissue-droplet)"/>
      <circle cx="11" cy="10" r="4" fill="#eaffff" fill-opacity="0.8"/>
      <circle cx="20" cy="21" r="3" fill="#b1ffff" fill-opacity="0.35"/>
    </symbol>
    <symbol id="tissue-floating-cell" viewBox="0 0 70 70">
      <path d="M10 30C5 16 20 6 31 12C40 3 57 12 55 24C68 31 60 49 48 48C43 63 24 61 23 49C10 50 3 40 10 30Z" fill="url(#tissue-cell)" stroke="#ff9bc2" stroke-width="2"/>
      <ellipse cx="35" cy="34" rx="14" ry="12" fill="#68236a"/>
      <ellipse cx="30" cy="29" rx="5" ry="4" fill="#d886c9" fill-opacity="0.7"/>
      <circle cx="47" cy="29" r="3" fill="#ffb2cf"/>
      <circle cx="24" cy="45" r="2.5" fill="#f9a1cc"/>
    </symbol>
    <symbol id="tissue-mesh-node" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.2" fill="#a76ce9"/>
      <circle cx="11" cy="10" r="1.2" fill="#f5e6ff"/>
    </symbol>
  </defs>

